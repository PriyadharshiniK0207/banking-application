
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 4px 15px #0002;
      text-align: center;
    }

    h1 { color: #164e8a; }

    .balance {
      font-size: 28px;
      font-weight: bold;
      color: #16804a;
    }

    .note { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Banking Application</h1>
    <p>Welcome to our Banking System</p>
    <hr>
    <p>Account Holder: User</p>
    <p>Account Balance</p>
    <div class="balance">₹1,000</div>
    <p class="note">Sample demonstration only</p>
  </div>
</body>
</html>
